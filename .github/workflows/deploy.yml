name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          # Reading files are stored with Git LFS. Fetch them so the build
          # deploys real PDFs rather than LFS pointer files.
          lfs: true
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22
          # The package manager and its version come from the packageManager
          # field in package.json. Do not add a version input here. The
          # action rejects two competing pnpm versions.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
